plugins { id 'com.android.application' }

android {
    namespace 'dev.viswesh.vibex.rewrite'
    compileSdk 35
    defaultConfig {
        // Isolated identity: do not pretend to be a signed upgrade of test7.
        applicationId 'dev.viswesh.vibex.rewrite'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0-source-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            // Release remains unsigned until a private signing identity is configured.
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    implementation 'androidx.core:core:1.16.0'
}

// Used by MediaSession callback results; pin explicitly rather than relying on a transitive API.
dependencies { implementation 'com.google.guava:guava:33.4.8-android' }
